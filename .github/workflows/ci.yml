name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows: é onde o MixAI roda de verdade (notebook da banda).
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci
      - run: npm ci --prefix web
      - run: npm run typecheck
      - name: F0E Restricted (fixtures, nenhum cmdlet de rede real)
        if: runner.os == 'Windows'
        run: npm exec vitest run test/f0e-restricted-windows.test.ts
      - run: npm test
      - run: npm run build
      # Interface (E3)
      - run: npm run test:web
      - run: npm run build:web
      # Integração com navegador real (Chromium): servidor LAB + build da interface.
      - name: Instalar Chromium (Playwright)
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - name: Testes de integração da interface
        if: runner.os == 'Linux'
        run: npm run test:e2e
      # O smoke nunca instala browser: o provisionamento do runner é explícito aqui.
      - name: Instalar Chromium para ensaio Windows
        if: runner.os == 'Windows'
        run: npx playwright install chromium
      - name: Ensaio Yoga LAB (loopback, descartável, sem hardware)
        run: npm run smoke:yoga -- --built
      - name: Preflight Windows somente consulta e sanitização
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/yoga-preflight.ps1 -SelfTest
          ./scripts/yoga-preflight.ps1

  https-lab:
    name: HTTPS LAB proxy (Caddy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Download and verify optional test proxy
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/mixai-caddy"
          cd "$RUNNER_TEMP/mixai-caddy"
          curl --fail --location --silent --show-error https://github.com/caddyserver/caddy/releases/download/v2.10.2/caddy_2.10.2_linux_amd64.tar.gz -o caddy_2.10.2_linux_amd64.tar.gz
          curl --fail --location --silent --show-error https://github.com/caddyserver/caddy/releases/download/v2.10.2/caddy_2.10.2_checksums.txt -o checksums.txt
          sha512sum --check --ignore-missing checksums.txt
          tar -xzf caddy_2.10.2_linux_amd64.tar.gz caddy
      - name: HTTPS/WSS with disposable test CA (never uploaded)
        shell: bash
        run: CADDY_BIN="$RUNNER_TEMP/mixai-caddy/caddy" npm run test:https-lab
