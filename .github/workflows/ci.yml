name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows: é onde o MixAI roda de verdade (notebook da banda).
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci
      - run: npm ci --prefix web
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Interface (E3)
      - run: npm run test:web
      - run: npm run build:web
      # Integração com navegador real (Chromium): servidor LAB + build da interface.
      - name: Instalar Chromium (Playwright)
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - name: Testes de integração da interface
        if: runner.os == 'Linux'
        run: npm run test:e2e
