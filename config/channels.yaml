# Nomes da banda para os canais e retornos.
# A ordem abaixo segue o numero da ENTRADA FISICA da Soundcraft Ui16.
# Nao altera a configuracao salva na mesa; nomes locais usados pelo MixAI.
# Acentos, maiusculas e espacos sao ignorados ("Violao" = "violao").
#
# Mapa informado pelo operador em 07/11/2026:
# CH1 Cavaco (Lucius), CH2 Violao, CH3 Fred, CH4 Lucius,
# CH5 Leandro, CH6 Fernando, CH7 Laviquinho, CH8 Surdo,
# CH9 Pandeiro, CH10 Tanta, CH11 Reserva, CH12 Livre (sem mapeamento).
# Confirmado pelo operador: Fred (CH3) e voz principal.
# Lucius (CH4), Leandro (CH5), Fernando (CH6) e Laviquinho (CH7) sao coro.
# Prioridade vocal e ordem fisica/visual nao sao ajustes de volume.
# Nao interpretar a ordem nem o papel como ajuste automatico de volume.

channels:
  - number: 1
    name: Cavaco
    aliases: [cavaco, cavaquinho, cava]
  - number: 2
    name: Violão
    aliases: [violão, violao, viola, 7 cordas]
  - number: 3
    name: Voz Fred
    aliases: [fred, voz do fred, voz fred]
  - number: 4
    name: Voz Lucius
    aliases: [lucius, voz do lucius, voz lucius]
  - number: 5
    name: Voz Leandro
    aliases: [leandro, voz do leandro, voz leandro, leandro ch5]
  - number: 6
    name: Voz Fernando
    aliases: [fernando, voz do fernando, voz fernando]
  - number: 7
    name: Voz Laviquinho
    aliases: [laviquinho, lavi, voz do laviquinho, voz laviquinho, mic do laviquinho]
  - number: 8
    name: Surdo
    aliases: [surdo, surdão, surdao]
  - number: 9
    name: Pandeiro
    aliases: [pandeiro, pandeirista]
  - number: 10
    name: Tantã
    aliases: [tantã, tanta, tantan, tan tan]
  - number: 11
    name: Reserva
    aliases: [reserva, convidado]

# Retornos. Formato roda de samba: todo mundo no fone, pelo amplificador
# de fones HA800, que recebe uma mix compartilhada no AUX 1.
aux:
  - number: 1
    name: Fones
    aliases: [fone, fones, retorno, retorno da roda, monitor, headphone, ponto]
