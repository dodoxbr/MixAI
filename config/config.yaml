# Configuração do MixAI
# Ajustes desta máquina (IP do Wi-Fi, porta...): crie config/config.local.yaml (fora do Git)
# a partir de config/config.local.example.yaml. Só os campos escritos lá mudam.
# Precedência: config.yaml < config.local.yaml < variáveis de ambiente (MIXAI_MODE, MIXAI_IP,
# MIXAI_PORT, MIXAI_LAN_HOST, MIXAI_CONFIG_DIR, MIXAI_LOG_DIR) < argumentos (--lab, --real...)

mixer:
  # lab  = laboratório persistente (sem conexão com a mesa; guarda o estado em data/)
  # mock = simulador em memória (testes; perde tudo ao fechar)
  # real = Soundcraft Ui16 física
  mode: lab
  # IP da mesa. 10.10.1.1 é o padrão do Wi-Fi da própria Ui; confira na tela de rede da mesa.
  ip: 10.10.1.1
  model: ui16
  # Tempo máximo (ms) para conectar
  connectTimeoutMs: 8000
  # Reconexão segura (mesa real). Não existe modo "legacy": na queda, a conexão é descartada,
  # recriada do zero e ressincronizada antes de aceitar qualquer comando. Nada é reenviado.
  connection:
    # Tempo máximo esperando o estado completo da mesa; depois disso fica SOMENTE LEITURA
    syncTimeoutMs: 5000
    # Escritas enviadas até este tempo antes de uma queda são verificadas após reconectar
    indeterminateWindowMs: 3000
    reconnectBaseMs: 1000
    reconnectMaxDelayMs: 10000

lab:
  # Arquivo de estado do laboratório (JSON versionado, com backup .bak). Relativo à pasta do projeto.
  stateFile: data/lab-state.json
  # Espera antes de gravar (ms), juntando mudanças seguidas
  saveDebounceMs: 300

server:
  # Servidor único (E2): npm run serve:lab (porta 8790) ou serve:real (porta 8791).
  # port: 8790          # vazio = padrão do modo
  # Por padrão só este notebook acessa (127.0.0.1). Para os celulares no Wi-Fi, NÃO edite
  # aqui: ponha server.lan no config/config.local.yaml (assim o git pull não dá conflito).
  lan:
    enabled: false
    # IP do Wi-Fi do NOTEBOOK (ipconfig > Wi-Fi > Endereço IPv4). Nunca o IP da mesa.
    host: ""
  # AUX que os músicos podem ajustar (retorno compartilhado dos fones)
  musicianAux: 1
  # O que os músicos podem fazer:
  #   fones_only        = só os fones (padrão)
  #   pa_without_master = fones + canais do PA em passos de até musicianPaStepDB; acima disso
  #                       vira aprovação do operador. Nunca o master, cenas ou aprovações.
  # Para mudar só nesta máquina, use config/config.local.yaml (fora do Git).
  musicianAccess: fones_only
  musicianPaStepDB: 3
  # Validade da sessão aberta com PIN (horas)
  sessionHours: 12
  # PINs: rode "npm run pin -- operador" / "npm run pin -- musico".
  # Ficam só como hash em config/secrets.yaml (fora do Git).

assistant:
  # Assistente de texto (E4). Tudo vira proposta com "Aplicar"; nada muda sozinho.
  # "um pouco" / sem dizer quanto:
  smallStepDB: 2
  # "mais":
  mediumStepDB: 3
  # "bastante", "muito":
  largeStepDB: 5
  # Validade da proposta (segundos)
  proposalTtlSec: 120

ai:
  # Claude (API da Anthropic), OPCIONAL. Sem chave, só o parser local (funciona sem internet).
  # A chave vai em config/secrets.yaml (anthropicApiKey: ...) ou na variável ANTHROPIC_API_KEY.
  enabled: false
  model: claude-haiku-5-5
  maxOutputTokens: 600
  maxInputChars: 400
  timeoutMs: 12000
  # Teto de gasto por dia, em dólares (estimado pelos preços abaixo)
  dailyBudgetUSD: 0.5
  maxRequestsPerMinute: 6
  # Preço por milhão de tokens (US$). Padrão: Claude Haiku 5.5. Confira o preço atual em
  # https://platform.claude.com/docs/en/about-claude/pricing
  priceInputPerMTok: 0.1
  priceOutputPerMTok: 0.5
  historyTurns: 4

naming:
  # false = só canais e AUX cadastrados no channels.yaml podem ser alterados
  allowUnmapped: false

safety:
  # Teto de volume (dB) que a IA consegue colocar num canal no master
  maxChannelLevelDB: 0
  # Teto de volume (dB) para os envios de retorno (AUX)
  maxAuxSendDB: 0
  # Teto do master
  maxMasterLevelDB: 0
  # Mudança acima disso (em dB, num único comando) pede confirmação
  maxStepDB: 6
  # Qualquer mudança no master pede confirmação
  masterRequiresConfirmation: true
  # Mutar mais canais que isso de uma vez pede confirmação
  bulkMuteConfirmAbove: 2
  # Limite de comandos que mudam a mesa por segundo
  maxActionsPerSecond: 5
  # Canal totalmente abaixado (-inf) é tratado como este valor em ajustes relativos
  relativeFloorDB: -60

logs:
  # Pasta do log de ações (um arquivo .jsonl por dia). Relativa à pasta do projeto.
  dir: logs
